<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xếp thời khóa biểu</title>
<style>
:root{
  --bg:#f3f5f1; --paper:#ffffff; --ink:#1b2430; --muted:#5b6571; --line:#d6dbd3;
  --board:#1f4436; --board-2:#2b5a48; --chalk:#eef5ef;
  --accent:#2457a6; --accent-ink:#ffffff; --ok:#1d7a46; --okbg:#d9f2e2; --bad:#b3261e; --badbg:#fbe3e1;
  --warn:#8a5d00; --warnbg:#fdf0cf; --lock:#e7eae4; --sel:#f2c200;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12161b; --paper:#1a1f26; --ink:#e5e9ee; --muted:#98a2ad; --line:#2d353f;
    --board:#163126; --board-2:#1f4134; --chalk:#dcebe1;
    --accent:#7ea9f2; --accent-ink:#0d1520; --ok:#63c58f; --okbg:#173a27; --bad:#f08b81; --badbg:#3d1d1b;
    --warn:#e6b24c; --warnbg:#3a2e12; --lock:#242b33; --sel:#c9a10a;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.5 "Segoe UI","Be Vietnam Pro",Roboto,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums}
header{background:linear-gradient(120deg,var(--board),var(--board-2));color:var(--chalk);padding:12px 24px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;max-width:1480px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{flex:none;width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center}
.logo .ic{width:26px;height:26px}
h1{margin:0;font-size:22px;font-weight:650;letter-spacing:.2px;line-height:1.2}
h1 small{display:block;font-size:13px;font-weight:400;opacity:.8;letter-spacing:0}
.tools{display:flex;flex-wrap:wrap;gap:6px}
.tools button{background:rgba(255,255,255,.06);color:var(--chalk);border:1px solid rgba(255,255,255,.3);display:inline-flex;align-items:center;gap:6px}
.tools button:hover{background:rgba(255,255,255,.16)}
.tools button.warnb:hover{background:#b3261e;border-color:#b3261e}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:22px;max-width:1480px;margin:0 auto;padding:20px 24px 0;align-items:start}
nav{position:sticky;top:12px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 8px;max-height:calc(100vh - 24px);overflow-y:auto}
nav .grp{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding:10px 10px 4px}
nav .grp:first-child{padding-top:2px}
nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;color:var(--ink);border:0;border-radius:8px;padding:8px 10px;margin:1px 0;white-space:nowrap}
nav button:hover{background:var(--bg)}
nav button.on{background:var(--board);color:var(--chalk);font-weight:600}
nav button .ic{color:var(--board-2)}
nav button.on .ic{color:var(--chalk)}
@media (prefers-color-scheme: dark){nav button .ic{color:#7fc4a2}.phead .pi{background:var(--board-2)}}
nav button .step{margin-left:auto;min-width:22px;height:20px;line-height:20px;border-radius:10px;background:var(--bg);color:var(--muted);font-size:11.5px;text-align:center}
nav button.on .step{background:rgba(255,255,255,.2);color:var(--chalk)}
nav button .dot{width:8px;height:8px;border-radius:4px;background:var(--ok);margin-left:-4px}
.navsum{margin:10px 6px 2px;padding:10px;border-radius:8px;background:var(--bg);font-size:12.5px;color:var(--muted);line-height:1.6}
.navsum b{color:var(--ink)}
.phead{display:flex;align-items:center;gap:14px;margin:0 0 16px}
.phead .pi{flex:none;width:46px;height:46px;border-radius:12px;background:var(--board);color:var(--chalk);display:grid;place-items:center}
.phead .pi .ic{width:24px;height:24px}
.phead .pt{font-size:21px;font-weight:650;line-height:1.2;margin:0}
.phead .pd{color:var(--muted);font-size:14px;margin:2px 0 0}
.phead .ps{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.pnext{margin-left:auto;display:flex;gap:6px}
.pnext button{display:inline-flex;align-items:center;gap:4px}
.foldh{border-left:0;padding-left:0;margin:0 0 6px}
.foldb{background:transparent;border:0;color:var(--ink);font:inherit;font-size:18px;font-weight:650;padding:2px 0;display:inline-flex;align-items:center;gap:6px;border-left:4px solid var(--board-2);padding-left:8px;border-radius:0}
.foldb:hover{color:var(--accent)}
.findw{position:relative;display:inline-flex;align-items:center}
.findw .ic{position:absolute;left:9px;color:var(--muted);pointer-events:none}
.findw input{padding-left:32px;width:210px}
/* Thu gọn khung */
main section.panel>h2.fh{cursor:pointer;user-select:none}
main section.panel>h2.fh::after{content:"";display:inline-block;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 0 4px 12px}
main section.panel.folded>h2.fh::after{transform:rotate(-45deg);margin-bottom:1px}
main section.panel.folded{padding-top:12px;padding-bottom:12px}
main section.panel.folded>h2{margin:0}
main section.panel.folded>*:not(h2){display:none !important}
main section.panel>h2.fh:hover{color:var(--accent)}
.foldbar{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;margin:-6px 0 10px}
.foldbar button{font-size:13px;padding:4px 10px}
/* Bảng gọn */
td.acts{white-space:nowrap}
td.acts button{padding:5px 10px;font-size:13px}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--warnbg);color:var(--warn);font-size:11.5px;font-weight:700;margin-left:4px;line-height:18px}
#tTbl.tcompact th:nth-child(3),#tTbl.tcompact td:nth-child(3),#tTbl.tcompact th:nth-child(6),#tTbl.tcompact td:nth-child(6),#tTbl.tcompact th:nth-child(7),#tTbl.tcompact td:nth-child(7),#tTbl.tcompact th:nth-child(10),#tTbl.tcompact td:nth-child(10),#tTbl.tcompact th:nth-child(11),#tTbl.tcompact td:nth-child(11),#tTbl.tcompact th:nth-child(12),#tTbl.tcompact td:nth-child(12){display:none}
#tTbl td:first-child input{min-width:170px}
#tTbl select[data-f="tGv"]{min-width:0 !important;width:96px}
#tTbl select[data-f="tCmode"]{width:138px}
.tbl td input[type=number]{width:62px}
.tbl td select{max-width:230px}
#cTbl td:first-child input{min-width:64px;width:72px}
#cTbl select[data-f="clsSite"]{max-width:150px}
#cTbl input[data-f="clsGv"]{min-width:130px !important}
#cTbl.ccompact .pmx{display:none}
#mTbl td input[type=number]{width:46px !important;padding:6px 4px}
#mTbl td:nth-child(1) input,#mTbl td:nth-child(2) input{min-width:0 !important;width:132px !important}
#mTbl select{max-width:148px}
.copy{max-width:1480px;margin:28px auto 0;padding:16px 24px 22px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;text-align:center;line-height:1.7}
.copy b{color:var(--ink);font-weight:600}
@media (max-width:1000px){.layout{grid-template-columns:1fr;padding:12px 12px 0;gap:12px}
  nav{position:static;display:flex;gap:4px;overflow-x:auto;max-height:none;padding:6px}
  nav .grp,.navsum{display:none}
  nav button{width:auto;flex:none}
  nav button .step{display:none}}
main{min-width:0;padding:0 0 40px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
h2{font-size:18px;margin:0 0 10px;padding-left:10px;border-left:4px solid var(--board-2);line-height:1.3}
h3{font-size:15px;margin:0 0 8px}
.hint{color:var(--muted);margin:0 0 12px;max-width:110ch}
button{font:inherit;cursor:pointer;border-radius:7px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:7px 14px}
button.ghost{background:transparent;color:var(--accent);border-color:var(--line)}
button.ghost:hover{border-color:var(--accent)}
button.danger{background:transparent;color:var(--bad);border-color:var(--line)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,td[data-act]:focus-visible{outline:3px solid var(--sel);outline-offset:1px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
input[type=number]{width:80px}
textarea{width:100%;min-height:110px;font-family:Consolas,"Courier New",monospace;font-size:13px}
.form{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:flex-end}
.form label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.form label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.tbl{border-collapse:collapse;width:100%}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:13px;border-bottom:1px solid var(--line);padding:6px 6px}
.tbl td{border-bottom:1px solid var(--line);padding:4px 6px;vertical-align:middle}
.tbl td input:not([type=number]){width:100%;min-width:90px}
.tbl td.n{color:var(--muted);white-space:nowrap}
.scroll{overflow-x:auto}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.gwrap{overflow-x:auto}
table.grid{border-collapse:separate;border-spacing:3px;min-width:100%}
table.grid th{font-size:13px;font-weight:600;color:var(--muted);padding:4px 6px;text-align:center}
table.grid th.rowh{text-align:right;white-space:nowrap;font-weight:500}
table.grid th.clk{cursor:pointer;text-decoration:underline dotted}
table.grid td{min-width:92px;height:50px;border-radius:7px;background:var(--bg);border:1px solid var(--line);padding:4px 6px;font-size:13px;line-height:1.25;vertical-align:top}
table.grid tr.sesbreak td,table.grid tr.sesbreak th{border-top:0}
table.grid tr.sesbreak th,table.grid tr.sesbreak td{padding-top:4px}
table.grid tr.sesbreak{outline:0}
.dense table.grid td{height:24px;padding:1px 4px;font-size:12px;line-height:1.15}.dense table.grid th{padding:1px 4px;font-size:12px}.dense table.grid td span{display:inline;font-size:11px;margin-left:4px}.dense table.grid td b{display:inline}.dense .hint{display:none}
table.grid tr.gap td{height:8px;border:0;background:transparent;padding:0}
table.grid td[data-act]{cursor:pointer}
table.grid td b{display:block;font-weight:600}
table.grid td span{display:block;color:var(--muted);font-size:12px}
.sj{background:hsl(var(--h) 62% 89%) !important;border-color:hsl(var(--h) 40% 72%) !important}
@media (prefers-color-scheme: dark){.sj{background:hsl(var(--h) 26% 25%) !important;border-color:hsl(var(--h) 25% 38%) !important}}
.sj.cont b{opacity:.55}
.pin{position:relative}.pin::after{content:"📌";position:absolute;top:2px;right:4px;font-size:11px}
.selbar{position:sticky;top:0;z-index:3;background:var(--warnbg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.full{box-shadow:inset 0 0 0 2px var(--bad)}
pre.msgtxt{white-space:pre-wrap;font:13px/1.5 Consolas,"Courier New",monospace;background:var(--bg);padding:10px;border-radius:8px;text-align:left}
.lockc{background:var(--lock) !important;color:var(--muted);font-style:italic}
.busyc{background:repeating-linear-gradient(135deg,var(--badbg) 0 6px,transparent 6px 12px) !important}
.sel{outline:3px solid var(--sel);outline-offset:-1px}
.tgt{box-shadow:inset 0 0 0 2px var(--ok);}
.tgt:not(.sj){background:var(--okbg) !important}
.tgtx{outline:2px dashed var(--accent);outline-offset:-3px}
td[draggable=true]{cursor:grab}
.dragover{box-shadow:inset 0 0 0 3px var(--sel) !important}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted);margin:8px 0}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px;border:1px solid var(--line)}
.msg{border-radius:8px;padding:8px 12px;margin:6px 0}
.msg.err{background:var(--badbg);color:var(--bad)}
.msg.warn{background:var(--warnbg);color:var(--warn)}
.msg.ok{background:var(--okbg);color:var(--ok)}
.bar{height:10px;border-radius:5px;background:var(--lock);overflow:hidden;margin:10px 0}
.bar div{height:100%;background:var(--ok);width:0;transition:width .2s}
.big{font-size:40px;font-weight:700;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px dashed var(--muted);border-radius:16px;padding:4px 12px;background:var(--paper);color:var(--ink);font-size:13px}
.chip.sel{border-style:solid}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;color:var(--ink)}
.seg button.on{background:var(--board);color:var(--chalk)}
.wide td{min-width:64px;height:42px;font-size:12px}
.wide th{font-size:12px}
.wide th.cls{text-align:left;position:sticky;left:0;background:var(--paper);z-index:1}
.askov{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:20}
.askbox{background:var(--paper);color:var(--ink);border-radius:10px;padding:18px 20px;width:min(440px,92vw);box-shadow:0 10px 40px rgba(0,0,0,.3)}
.askbox p{margin:0 0 10px}.askbox input{width:100%}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;max-width:90vw;box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:9;font-size:14px}
.steps{margin:0;padding-left:20px;max-width:75ch}
.steps li{margin:4px 0}
@media (max-width:640px){header{padding:10px 12px}h1{font-size:19px}.logo{width:38px;height:38px}.tools button span{display:none}.pnext{display:none}}
#printArea{display:none}
.report h3{margin:18px 0 6px;font-size:15px}
.report table{border-collapse:collapse;margin-bottom:8px}
.report td,.report th{border:1px solid var(--line);padding:4px 6px;font-size:12px;text-align:center;vertical-align:middle;min-width:54px}
.report th{background:var(--lock)}
.report td.l,.report th.l{text-align:left;white-space:nowrap}
.preview{max-height:70vh;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:10px 14px;background:var(--paper)}
@media print{
  body.prep header,body.prep nav,body.prep main,body.prep .copy{display:none !important}
  body.prep #printArea{display:block;color:#000}
  #printArea .report td,#printArea .report th{border:1px solid #444;background:#fff;color:#000}
  .pb{page-break-after:always;break-after:page}
  header,nav,.noprint,.toast,.copy,.phead{display:none !important}
  .layout{display:block;padding:0}
  body{background:#fff;color:#000}
  main{padding:0}
  .panel{border:0;padding:0}
  table.grid td{border:1px solid #999 !important;background:#fff !important}
}
/* ===== Giao diện mới ===== */
:root{--bg:#eef3f1;--line:#d3ddd8;--board:#0f5a45;--board-2:#16846a;--accent:#1f5fd1;--am:#d97706;--ambg:#fff4e0;--pm:#4f46e5;--pmbg:#ecebff;--gv:#0f766e;--gvbg:#e2f5f1;--card-sh:0 1px 2px rgba(16,40,32,.05),0 4px 14px rgba(16,40,32,.06)}
@media (prefers-color-scheme: dark){:root{--bg:#0f1417;--line:#2a343a;--board:#123d31;--board-2:#1b5e4b;--accent:#82acf5;--am:#f5b54a;--ambg:#3a2a0f;--pm:#a5a1ff;--pmbg:#25234a;--gv:#5fd0bd;--gvbg:#123430;--card-sh:0 1px 2px rgba(0,0,0,.3)}}
body{background:radial-gradient(1200px 500px at 85% -10%,rgba(22,132,106,.10),transparent 60%),var(--bg);background-attachment:fixed}
header{background:linear-gradient(115deg,#0b4a39 0%,var(--board) 45%,var(--board-2) 100%);padding:14px 24px;box-shadow:0 4px 18px rgba(8,50,38,.25)}
@media (prefers-color-scheme: dark){header{background:linear-gradient(115deg,#0a241c,var(--board) 50%,var(--board-2))}}
.logo{background:rgba(255,255,255,.18);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.tools button{border-radius:9px;padding:7px 13px}
nav{border-radius:14px;box-shadow:var(--card-sh);border-color:transparent}
nav button{border-radius:9px;padding:9px 10px;transition:background .15s}
nav button.on{background:linear-gradient(120deg,var(--board),var(--board-2));box-shadow:0 3px 10px rgba(15,90,69,.28)}
.panel{border-radius:14px;border-color:transparent;box-shadow:var(--card-sh);padding:20px 22px}
h2{border-left-color:var(--board-2);font-size:18.5px}
.phead .pi{background:linear-gradient(135deg,var(--board),var(--board-2));box-shadow:0 4px 12px rgba(15,90,69,.28);border-radius:14px}
.phead .pt{font-size:23px}
button{border-radius:9px;transition:filter .15s,box-shadow .15s,background .15s}
button:not(.ghost):not(.danger):not(:disabled):hover{filter:brightness(1.08);box-shadow:0 3px 10px rgba(31,95,209,.25)}
input,select,textarea{border-radius:8px;padding:7px 9px;transition:border-color .15s,box-shadow .15s}
input:hover,select:hover{border-color:#9fb3aa}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,95,209,.18)}
.tbl th{background:var(--bg);color:var(--ink);font-weight:600;padding:8px 6px;position:sticky;top:0;z-index:1}
.tbl tr:hover td{background:rgba(22,132,106,.05)}
.msg{border-radius:10px;padding:10px 14px}
.chip{border-radius:999px}
table.grid td{border-radius:8px}
/* Khung giờ: ô số lớn */
.ktiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:12px;margin:6px 0 14px}
.kt{position:relative;display:flex;flex-direction:column;gap:6px;padding:14px 14px 12px;border-radius:14px;background:var(--paper);border:1.5px solid var(--line);border-top:5px solid var(--c,var(--board-2));cursor:text}
.kt:hover{box-shadow:var(--card-sh)}
.kt:focus-within{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent)}
.kt .kl{font-size:14px;font-weight:650;color:var(--c,var(--ink))}
.kt input,.kt select{width:100%;font-size:30px;font-weight:750;line-height:1.1;padding:4px 8px;text-align:center;border:0;border-radius:10px;background:var(--cb,var(--bg));color:var(--ink);box-shadow:none}
.kt select{font-size:20px;padding:8px 4px;text-align-last:center;cursor:pointer}
.kt .ku{font-size:12.5px;color:var(--muted);text-align:center}
.kt.kday{--c:var(--board-2);--cb:var(--gvbg)}
.kt.kam{--c:var(--am);--cb:var(--ambg)}
.kt.kpm{--c:var(--pm);--cb:var(--pmbg)}
.kt.kgv{--c:var(--gv);--cb:var(--gvbg)}
/* hình dung ngày học */
.dstrip{border:1.5px dashed var(--line);border-radius:14px;padding:12px 14px;margin:0 0 18px;background:var(--paper)}
.dshd{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:8px}
.dsrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0}
.dsn{width:64px;font-weight:700;font-size:14px}.dsn.am{color:var(--am)}.dsn.pm{color:var(--pm)}
.dsp{min-width:70px;text-align:center;padding:7px 10px;border-radius:9px;font-weight:650;font-size:14px}
.dsp.am{background:var(--ambg);color:var(--am)}.dsp.pm{background:var(--pmbg);color:var(--pm)}
.dsb{padding:7px 12px;border-radius:9px;font-size:13px;font-weight:650;color:var(--ok);background:repeating-linear-gradient(135deg,var(--okbg) 0 7px,transparent 7px 14px);border:1.5px dashed var(--ok)}
.dsoff{color:var(--muted)}
/* nhóm quy định */
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px}
.kg{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--paper);border-left:5px solid var(--gc)}
.kg.g1{--gc:var(--gv)}.kg.g2{--gc:#c2410c}.kg.g3{--gc:var(--pm)}.kg.g4{--gc:var(--am)}.kg.g5{--gc:var(--accent)}
.kgh{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;margin-bottom:10px}
.kgi{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--gc);color:#fff;font-size:13px;flex:none}
@media (prefers-color-scheme: dark){.kgi{color:#111}}
.kgn{margin:-4px 0 8px;font-size:13px;color:var(--muted)}
.kgb{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px 14px}
.kgb label{display:flex;flex-direction:column;gap:5px;font-size:13.5px;font-weight:600;color:var(--ink);min-width:0}
.kgb label select,.kgb label input:not([type=checkbox]){width:100% !important;font-weight:400;font-size:14.5px}
.kgb label input[type=number]{max-width:110px;font-size:17px;font-weight:650;text-align:center}
/* buổi phụ dạng lưới */
.srgrid{display:grid;grid-template-columns:minmax(150px,200px) repeat(2,minmax(150px,220px));gap:10px 14px;align-items:center;margin:4px 0 4px;padding:14px;border-radius:14px;background:var(--bg)}
.srh{font-weight:700;font-size:14px;text-align:center}.srh em{display:block;font-style:normal;font-weight:400;font-size:12px;color:var(--muted)}
.srn{font-weight:700;font-size:15px}.srn small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.srn.am{color:var(--am)}.srn.pm{color:var(--pm)}
.srgrid input{font-size:24px;font-weight:750;text-align:center;padding:6px;width:100%}
.lockcols{grid-template-columns:repeat(auto-fit,minmax(560px,1fr))}
.kt .kl{min-height:2.6em}
.kgrid{grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr))}
.lockcols{grid-template-columns:repeat(auto-fit,minmax(min(560px,100%),1fr))}
@media (max-width:640px){.srgrid{grid-template-columns:1.2fr 1fr 1fr;padding:10px;gap:8px}.srgrid input{font-size:20px}.kgb{grid-template-columns:1fr}}

/* Xếp TKB: thẻ số liệu và danh sách ghi chú */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin:16px 0 18px}
.kpi{border-radius:14px;padding:14px 16px;background:var(--bg);border:1.5px solid transparent;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--kc,var(--muted))}
.kpi .kpv{font-size:32px;font-weight:800;line-height:1.05;color:var(--kc,var(--ink));letter-spacing:-.5px}
.kpi .kpl{font-weight:650;font-size:14px;margin-top:4px}
.kpi .kps{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.35}
.kpi.ok{--kc:var(--ok);background:var(--okbg)}
.kpi.warn{--kc:var(--warn);background:var(--warnbg)}
.kpi.bad{--kc:var(--bad);background:var(--badbg)}
.kpi.info{--kc:var(--accent)}
.notes{display:flex;flex-direction:column;gap:8px}
.notes>p.hint,.notes>details.hint{max-width:none;margin:0 !important;padding:10px 14px 10px 38px;border-radius:10px;background:var(--bg);color:var(--ink);position:relative;font-size:14px}
.notes>p.hint::before,.notes>details.hint::before{content:"i";position:absolute;left:12px;top:11px;width:18px;height:18px;border-radius:50%;background:var(--accent);color:#fff;font:700 12px/18px Georgia,serif;text-align:center}
.notes>.msg{margin:0;padding:10px 14px;border-left:4px solid currentColor}
.notes>#ptext{display:none}
.big{font-size:44px;font-weight:800;letter-spacing:-1px;background:linear-gradient(120deg,var(--board),var(--board-2));-webkit-background-clip:text;background-clip:text;color:transparent}
@media (prefers-color-scheme: dark){.big{background:none;color:var(--ok)}}
.bar{height:12px;border-radius:6px}
.bar div{background:linear-gradient(90deg,var(--board-2),#34c38f);border-radius:6px}
/* Bảng dữ liệu kiểu bảng tính: ô nhập gọn, hiện viền khi rê chuột */
.tbl{border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.scroll>.tbl{overflow:visible}
.tbl th{border-bottom:1.5px solid var(--line);font-size:12.5px;text-transform:none;white-space:normal;vertical-align:bottom}
.tbl tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--bg) 55%,var(--paper))}
.tbl tbody tr:hover td{background:color-mix(in srgb,var(--board-2) 8%,var(--paper))}
.tbl td{border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);padding:3px 5px}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl td input:not([type=checkbox]),.tbl td select{border-color:transparent;background:transparent;padding:6px 7px}
.tbl td input:not([type=checkbox]):hover,.tbl td select:hover{border-color:var(--line);background:var(--paper)}
.tbl td input:not([type=checkbox]):focus,.tbl td select:focus{background:var(--paper);border-color:var(--accent)}
.tbl td input[type=number]{text-align:center;font-weight:650}
.tbl td input:first-child[data-f]{font-weight:600}
.tbl td select{cursor:pointer}
.tbl tfoot td,.tbl tr.sum td{font-weight:700;background:var(--bg) !important}
.tbl button{padding:4px 10px;font-size:13px}
.tbl button.danger{border-color:transparent;border-radius:50%;width:30px;height:30px;padding:0;font-weight:700}
.tbl button.danger:hover{background:var(--badbg);border-color:var(--bad)}
/* Các nút công cụ, khung gấp */
main section.panel.folded{transition:box-shadow .15s}
main section.panel.folded:hover{box-shadow:0 2px 6px rgba(16,40,32,.08),0 8px 22px rgba(16,40,32,.08)}
.foldbar button{border-radius:999px}
.form label{font-weight:600;font-size:13.5px}
.form label select,.form label input{font-weight:400}
.form label.chk{font-weight:400}
.seg{border-radius:10px;padding:3px;gap:2px;background:var(--bg);border:0}

.seg button.on{background:linear-gradient(120deg,var(--board),var(--board-2));box-shadow:0 2px 8px rgba(15,90,69,.25)}

.chip{border:1.5px solid var(--line);border-style:solid;padding:5px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}

.chip input{accent-color:var(--board-2)}
input[type=checkbox]{accent-color:var(--board-2);width:16px;height:16px}

nav .rbtn.done .rstep{background:var(--ok);color:#fff}

nav .rbtn.on .ri{background:rgba(255,255,255,.18)}nav .rbtn.on .ri .ic{color:#fff}
nav .rbtn.on .rt{font-weight:700}nav .rbtn.on .rstep{background:#fff;color:var(--board)}
nav .rtools .rbtn .ri{background:color-mix(in srgb,var(--accent) 12%,var(--paper))}nav .rtools .rbtn .ri .ic{color:var(--accent)}

@media (prefers-color-scheme: dark){nav#nav{background:color-mix(in srgb,var(--paper) 94%,transparent)}nav .rbtn .ri .ic{color:#7fc4a2}nav .rbtn.done .rstep{color:#111}}

.pcn{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--board-2);color:#fff;font-size:13px}.pcard+.pcard .pcn{background:var(--accent)}

<script id="engine">
/* ================= BỘ XẾP LỊCH (không phụ thuộc giao diện) ================= */
const TKB = (function(){
  const DAYS=['Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7','CN'];
  const SES=['Sáng','Chiều'];
  const TYNAME={S:'Lớp học buổi sáng',C:'Lớp học buổi chiều',SC:'Lớp học 2 buổi'};
  const sesList=t=>t==='C'?[1]:t==='SC'?[0,1]:[0];
  const pairKey=(a,b)=>[a,b].sort().join('|');

  function precheck(M){const sv=M.units.map(u=>u.cands);M.units.forEach(u=>{if(u.candsAll)u.cands=u.candsAll;});try{return precheck0(M);}finally{M.units.forEach((u,i)=>{u.cands=sv[i];});}}
  function precheck0(M){

    {const byCM=new Map();M.units.forEach(u=>{const k=u.c*M.nM+u.m;if(!byCM.has(k))byCM.set(k,[]);byCM.get(k).push(u);});

      if(bad.length)out.push({lv:'warn',msg:'Tổ '+g.name+': '+bad.join(', ')+' có tiết cố định (chào cờ, SHL, trường khác) đúng buổi nghỉ chung đã chọn'});});
    /* Sức chứa thật theo vị trí: mỗi buổi GV chỉ đứng 1 lớp, tiết đôi cần 2 tiết liền nhau hợp lệ */
    M.teachers.forEach((t,ti)=>{const us=M.units.filter(u=>u.t===ti&&u.cands.length);if(!us.length)return;
      const cap=(list,sOnly)=>{let c=0,per={};for(let ds=0;ds<M.D2;ds++){if(sOnly!=null&&(ds&1)!==sOnly)continue;
          const iv=[];list.forEach(u=>u.cands.forEach(st=>{if(Math.floor(st/M.P)===ds)iv.push([st%M.P,st%M.P+u.len-1]);}));

      let hit=false;for(const s of [0,1]){const only=us.filter(u=>u.cands.every(st=>(Math.floor(st/M.P)&1)===s));if(!only.length)continue;

      const r=cap(us,null);if(us.length>r.c&&!hit)out.push({lv:'err',msg:'GV '+t.name+' có '+us.length+' lần dạy nhưng với các vị trí hợp lệ chỉ xếp được tối đa '+r.c+' lần/tuần'});});
    M.teachers.forEach((t,ti)=>{let need=0;M.units.forEach(u=>{if(u.t===ti)need+=u.len;});if(!need)return;
      const ses=new Set();M.units.forEach(u=>{if(u.t===ti)sesList(M.classes[u.c].ses).forEach(s=>ses.add(s));});
      let avail=0;for(let d=0;d<M.D;d++){let ad=0;for(const s of ses){let free=0;for(let p=0;p<M.per[s];p++)if(!t.block.has((d*2+s)*M.P+p))free++;ad+=Math.min(free,t.max);}avail+=t.maxDay?Math.min(ad,t.maxDay):ad;}

        M.units.forEach(u=>{if(u.t!==ti||u.ses!==letter)return;need2+=u.len;const cl=M.classes[u.c];if(cl.pmDays&&cl.sub===s)cl.pmDays.forEach(d=>days.add(d));else all=true;});
        if(!need2)continue;let cap=0;for(let d=0;d<M.D;d++){if(!all&&!days.has(d))continue;let free=0;for(let p=0;p<M.per[s];p++)if(!t.block.has((d*2+s)*M.P+p))free++;cap+=Math.min(free,t.max);}

      {const nd=M.units.filter(u=>u.t===ti&&u.len===2).length;if(nd){let cap2=0;for(let d=0;d<M.D;d++)for(const s of ses){let free=0;for(let p=0;p<M.per[s];p++)if(!t.block.has((d*2+s)*M.P+p))free++;cap2+=Math.floor(Math.min(free,t.max)/2);}
        if(nd>cap2)out.push({lv:'err',msg:'GV '+t.name+' có '+nd+' lần tiết đôi nhưng chỉ xếp được tối đa '+cap2+' lần (giới hạn '+t.max+' tiết/buổi và lịch bận). Hãy tăng giới hạn tiết/buổi của GV này'});
        else if(nd>cap2*0.8)out.push({lv:'warn',msg:'GV '+t.name+' có '+nd+' lần tiết đôi, gần chạm mức tối đa '+cap2+' lần xếp được (giới hạn '+t.max+' tiết/buổi), có thể khó xếp'});}}

    return out;
  }

  if(s.p&&s.p[g]){const v=s.p[g][S.term||0];if(v!==undefined&&v!==null&&v!=='')return +v;}
  const mp={};String(s.nG||'').split(/[,;]/).forEach(x=>{const[a,b]=x.split(':').map(y=>y.trim());if(a&&b!==undefined&&b!=='')mp[a]=+b;});

function paSet(c,mName,mode){const sel=view.paT;
  const rows=S.assigns.filter(a=>a.c===c&&a.m===mName);
  if(rows.length&&rows.every(a=>a.t===sel)){if(mode!=='add')S.assigns=S.assigns.filter(a=>!(a.c===c&&a.m===mName));return 'del';}
  if(rows.length){if(mode==='fill')return 'skip';rows.forEach(a=>a.t=sel);return 'set';}
  let n=defN(mName,c);if(n==null)return 'cancel';
  if(!n)return 'skip';const sub=(S.subjects.find(y=>y.name===mName)||{}).subDef&&isSubCls(c);S.assigns.push({c,m:mName,t:sel,n,dbl:'',nC:sub?n:null});return 'add';}

const tSubjects=t=>{const s=new Set(t.subjects||[]);S.assigns.forEach(a=>{if(a.t===t.name)s.add(a.m);});return S.subjects.map(m=>m.name).filter(n=>s.has(n));};
function assignOne(tn,c,m,on){const rows=S.assigns.filter(a=>a.c===c&&a.m===m);
  if(!on){S.assigns=S.assigns.filter(a=>!(a.c===c&&a.m===m&&a.t===tn));return true;}

/* ---------- Đọc file Excel (.xlsx) không cần thư viện: giải nén zip bằng DecompressionStream, đọc XML ---------- */
async function readXlsx(file){const buf=new Uint8Array(await file.arrayBuffer()),dv=new DataView(buf.buffer);
  let e=-1;for(let i=buf.length-22;i>=Math.max(0,buf.length-70000);i--)if(dv.getUint32(i,true)===0x06054b50){e=i;break;}

  const n=dv.getUint16(e+10,true);let o=dv.getUint32(e+16,true);const files={};const td=new TextDecoder();
  for(let k=0;k<n;k++){if(dv.getUint32(o,true)!==0x02014b50)break;const meth=dv.getUint16(o+10,true),csz=dv.getUint32(o+20,true),nl=dv.getUint16(o+28,true),xl=dv.getUint16(o+30,true),cl=dv.getUint16(o+32,true),lo=dv.getUint32(o+42,true);
    const name=td.decode(buf.subarray(o+46,o+46+nl));files[name]={meth,csz,lo};o+=46+nl+xl+cl;}
  const get=async name=>{const f=files[name];if(!f)return null;const lo=f.lo,st=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true),raw=buf.subarray(st,st+f.csz);
    if(f.meth===0)return td.decode(raw);if(f.meth!==8)throw new Error('Kiểu nén không hỗ trợ');
    const ds=new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return td.decode(await new Response(ds).arrayBuffer());};

    let t=findByName(S.teachers,R.name);if(!t){t={name:R.name.trim().replace(/\s+/g,' '),max:null,busy:[],subjects:[]};S.teachers.push(t);added.t.push(t.name);}else if(!seenT.has(t.name))nU++;seenT.add(t.name);

      if(!n){warn.push(t.name+' – '+m.name+' – '+c.name+': '+(isSkip(c.name,m.name)?'lớp này đánh dấu không học môn này':'chưa rõ số tiết (khai ở sheet/trang Môn học hoặc gõ số tiết thay cho x)'));return;}

function importPccm(txt,replace){const warn=[],list=[];

  const guide=`<section class="panel"><h2>Ràng buộc của giáo viên ở đâu?</h2><p class="hint" style="margin:0">• <b>Nghỉ cố định 1 ngày/buổi, không dạy tiết 1, tiết 5, dạy trường khác, lịch bận</b>: bấm nút <b>"Lịch bận, nguyện vọng"</b> ở dòng của GV trong bảng danh sách bên dưới (mỗi điều chọn được Bắt buộc hoặc Ưu tiên; có nút áp dụng cho tất cả GV).<br>• <b>Hai GV không dạy cùng ngày/buổi</b> (ví dụ vợ chồng): mục "Ràng buộc giữa hai giáo viên".<br>• <b>Số tiết tối đa/buổi, /ngày, số buổi/tuần</b>: các cột trong bảng danh sách. Mức chung, tiết trống, dồn lịch: trang Khung giờ.</p></section>`;
  return addT+guide+busy+pGroups()+pPairs()+pQuota()+`<section class="panel"><h2>Giáo viên (${S.teachers.length})</h2><div class="row" style="margin:0 0 10px"><input id="tFind" type="search" placeholder="Tìm GV theo tên hoặc môn…" style="min-width:280px" value="${esc(view.tFind||'')}"><span class="hint" id="tFindN" style="margin:0"></span></div><p class="hint">Cột "Dồn lịch": "Theo mức chung" dùng mức ở trang Khung giờ; "Không dồn" xếp đâu cũng được (giúp lịch dễ xếp hơn, nên dùng cho GV môn ít tiết); "Dàn đều" mỗi ngày số tiết gần bằng nhau; "Dồn tối đa" gom vào ít buổi nhất. Đều là mong muốn, không làm thiếu tiết.</p><p class="hint">Để trống "tối đa tiết/buổi" thì dùng mức chung ${S.defMax} tiết. "Tối đa tiết/ngày" là bắt buộc. "Tối đa buổi/tuần" là mong muốn: chương trình cố dồn lịch để GV có buổi nghỉ.</p>
<div class="row" style="margin:0 0 8px"><button class="ghost" data-act="tCols">${view.tFull?'Thu gọn bảng (ẩn cột ít dùng)':'Hiện đủ cột (Tổ CM, tối đa tiết/ngày, buổi/tuần, kiêm nhiệm, giảm tiết, định mức riêng)'}</button></div>
<div class="scroll"><table class="tbl${view.tFull?'':' tcompact'}" id="tTbl"><thead><tr><th>Họ tên</th><th>Môn dạy</th><th>Tổ CM</th><th>Chủ nhiệm</th><th>Tối đa tiết/buổi</th><th>Tối đa tiết/ngày</th><th>Tối đa buổi/tuần</th><th>Tối đa ngày/tuần</th><th>Dồn lịch</th><th>Kiêm nhiệm</th><th>Giảm tiết</th><th>Định mức riêng</th><th>Tiết/tuần</th><th>Số lớp</th><th>Lịch bận</th><th></th></tr></thead><tbody>
${S.teachers.map((t,i)=>`<tr data-name="${esc((t.name+' '+tSubjects(t).join(' ')).toLowerCase())}"><td><input value="${esc(t.name)}" data-f="tName" data-i="${i}"></td><td><input style="min-width:130px" value="${esc(tSubjects(t).join('/'))}" data-f="tSubj" data-i="${i}" placeholder="vd Toán/Tin học"></td><td><input list="grpList" style="min-width:110px" value="${esc(t.grp||'')}" data-f="tGrp" data-i="${i}" placeholder="vd Tổ Toán"></td><td><select data-f="tGv" data-i="${i}" style="min-width:90px"><option value="">—</option>${S.classes.map(c=>`<option value="${esc(c.name)}" ${c.gvcn===t.name?'selected':''}>${esc(c.name)}${c.gvcn&&c.gvcn!==t.name?' ('+esc(short(c.gvcn))+')':''}</option>`).join('')}</select></td><td><input type="number" min="1" max="6" placeholder="${S.defMax}" value="${t.max||''}" data-f="tMax" data-i="${i}"></td><td><input type="number" min="1" max="12" placeholder="tự do" value="${t.maxDay||''}" data-f="tMaxDay" data-i="${i}"></td><td><input type="number" min="1" max="14" placeholder="tự do" value="${t.maxSes||''}" data-f="tMaxSes" data-i="${i}" title="Cố gắng dồn lịch GV vào số buổi này"></td><td><input type="number" min="1" max="7" placeholder="${S.minOff?S.days-S.minOff:'tự do'}" value="${t.maxDays||''}" data-f="tMaxDays" data-i="${i}" title="Số ngày dạy tối đa/tuần của GV này; ghi riêng sẽ thay cho mức chung &quot;nghỉ ít nhất&quot; ở trang Khung giờ"></td><td><select data-f="tCmode" data-i="${i}" title="Không dồn: xếp đâu cũng được. Dàn đều: mỗi ngày số tiết gần bằng nhau. Dồn tối đa: gom vào ít buổi nhất">${[['','Theo mức chung'],['none','Không dồn'],['even','Dàn đều'],['max','Dồn tối đa']].map(([v,l])=>`<option value="${v}" ${(t.cmode||'')===v?'selected':''}>${l}</option>`).join('')}</select></td><td><input style="min-width:120px" placeholder="vd Tổ trưởng" value="${esc(t.duty||'')}" data-f="tDuty" data-i="${i}"></td><td><input type="number" min="0" max="19" placeholder="0" value="${t.red||''}" data-f="tRed" data-i="${i}" title="Số tiết được giảm do kiêm nhiệm (không tính GVCN, GVCN tự cộng)"></td><td><input type="number" min="0" max="30" placeholder="${S.quota||19}" value="${t.quota||''}" data-f="tQuota" data-i="${i}"></td><td class="n">${load[t.name]||0}</td><td class="n">${cls[t.name]?cls[t.name].size:0}</td>${(()=>{const bz=[(t.busy||[]).length?t.busy.length+' tiết bận':'',(t.ext||[]).length?'dạy trường khác '+t.ext.length+' tiết':'',t.offDays?'nghỉ thứ '+t.offDays:'',t.offSes?'nghỉ '+t.offSes:'',t.noS?'không T'+t.noS+' sáng':'',t.noC?'không T'+t.noC+' chiều':''].filter(Boolean);
  return `<td class="acts"><button class="ghost" data-act="ptGo" data-i="${i}" title="Tick các lớp GV này dạy">Phân công</button> <button class="ghost" data-act="busyOpen" data-i="${i}" title="${esc(bz.length?bz.join(', '):'Chưa khai lịch bận, nguyện vọng')}">Lịch bận${bz.length?`<span class="badge">${bz.length}</span>`:''}</button></td>`;})()}<td style="width:1%"><button class="danger" data-act="delT" data-i="${i}">Xóa</button></td></tr>`).join('')}
</tbody></table></div></section>`;
}

/* Tiết SHL do GVCN dạy (môn "tiết khóa" có tên SHL / sinh hoạt lớp) được tính vào tiết dạy của GVCN */
function shlOf(tn){let n=0;S.classes.forEach(c=>{if(c.gvcn!==tn)return;S.subjects.forEach(m=>{if(m.fixed&&/shl|sinh hoạt lớp/i.test(m.name)&&m.p&&m.p[gradeOf(c.name)]){n+=+(m.p[gradeOf(c.name)][S.term||0])||0;}});});return n;}
function quotaRows(){const ld={};S.assigns.forEach(a=>ld[a.t]=(ld[a.t]||0)+(+a.n||0));S.teachers.forEach(t=>{const x=shlOf(t.name);if(x)ld[t.name]=(ld[t.name]||0)+x;});
  return S.teachers.map(t=>{const cn=S.classes.filter(c=>c.gvcn===t.name).map(c=>c.name);const red=(+t.red||0)+(cn.length?(+S.gvcnRed||0):0);
    const day=ld[t.name]||0,q=+t.quota||+S.quota||19;return{t,day,cn,red,total:day+red,q,diff:day+red-q};});}
/* Lý do chính khiến một tiết không xếp được (gom từ mọi ô có thể đặt) */
function whyTop(m,u){const cnt=new Map();for(const st of u.cands)for(const r of TKB.why(m,u,st)){const k=r.replace(/lớp \S+$/,'lớp khác').replace(/\(.*\)$/,'').replace(/tiết \d+, cần/,'tiết …, cần').trim();cnt.set(k,(cnt.get(k)||0)+1);}
  const top=[...cnt.entries()].sort((a,b)=>b[1]-a[1]).slice(0,3);if(!top.length)return '';
  const rep=top.some(([k])=>/đã đủ \d+ lần trong ngày/.test(k));
  return `<div class="hint" style="margin:4px 0 0">Vướng: ${top.map(([k,n])=>esc(k)+' ('+n+' ô)').join('; ')}.${rep?` <button class="ghost" data-act="allow2" data-k="${esc(m.subjects[u.m].name)}" title="Đặt 'Tối đa 2 lần/ngày' cho môn này; chương trình vẫn cố tránh">Cho ${esc(m.subjects[u.m].name)} học 2 lần/ngày khi bắt buộc</button>`:''}</div>`;}
/* ---------- Tổ chuyên môn ---------- */
const grpNames=()=>[...new Set(S.teachers.map(t=>String(t.grp||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'vi'));
const dsOpts=()=>{const o=[];for(let d=0;d<S.days;d++)for(const s of [0,1])if(S.per[s]>0)o.push([d+'-'+s,DAYS[d]+' '+SES[s].toLowerCase()]);return o;};
function pGroups(){const gs=grpNames(),cfg=S.grpCfg||{};
  let st=null;if(gs.length&&S.result&&S.result.pos){const m=model();if(TKB.stats(m).placed){st={};TKB.stats(m).grp.forEach(x=>{st[m.groups[x.g].name]=x;});}}
  const stTxt=g=>{const x=st&&st[g];if(!x)return '<span class="hint">—</span>';const m=model(),P=m.P;
    if(x.ok==='ses')return `<span style="color:var(--ok);font-weight:600">Nghỉ chung ${DAYS[x.ds>>1]} ${SES[x.ds&1].toLowerCase()}</span>`;
    if(x.ok==='slot'){const ds=Math.floor(x.sl/P);return `<span style="color:var(--warn);font-weight:600">Chỉ trống chung tiết ${x.sl%P+1} ${SES[ds&1].toLowerCase()} ${DAYS[ds>>1]}</span>`;}
    return '<span style="color:var(--bad);font-weight:600">Không có giờ trống chung</span>';};
  return `<datalist id="grpList">${gs.map(g=>`<option value="${esc(g)}">`).join('')}</datalist><section class="panel"><h2>Tổ chuyên môn</h2>
<p class="hint">Ghi tổ cho từng GV ở cột "Tổ CM" trong bảng danh sách bên dưới, hoặc gán nhanh theo môn. Khi xếp, chương trình cố cho cả tổ nghỉ chung 1 buổi trong tuần để sinh hoạt tổ; không được thì ít nhất trống chung 1 tiết.</p>
<div class="form"><label class="chk"><input type="checkbox" data-f="grpOff" ${S.grpOff!==false?'checked':''}> Xếp buổi nghỉ chung cho tổ (không được thì trống chung 1 tiết)</label></div>
<div class="row">Gán nhanh: GV dạy môn <select id="grpSubj">${S.subjects.map(m=>`<option>${esc(m.name)}</option>`).join('')}</select> vào tổ <input id="grpName" list="grpList" style="width:160px" placeholder="vd Tổ Toán – Tin"><button class="ghost" data-act="grpBySubj">Áp dụng</button></div>
${gs.length?`<div class="scroll" style="margin-top:10px"><table class="tbl"><thead><tr><th>Tổ</th><th>Số GV</th><th>Thành viên</th><th>Buổi nghỉ chung</th><th>Kết quả xếp</th></tr></thead><tbody>${gs.map(g=>{const mem=S.teachers.filter(t=>String(t.grp||'').trim()===g);
  return `<tr><td><b>${esc(g)}</b></td><td class="n">${mem.length}</td><td style="font-size:13px">${mem.map(t=>esc(t.name)).join(', ')}</td><td><select data-f="grpDs" data-k="${esc(g)}"><option value="">Tự chọn</option>${dsOpts().map(([v,l])=>`<option value="${v}" ${(cfg[g]||{}).ds===v?'selected':''}>${l}</option>`).join('')}</select></td><td>${stTxt(g)}</td></tr>`;}).join('')}</tbody></table></div>`:'<p class="hint" style="margin:10px 0 0">Chưa có tổ nào.</p>'}</section>`;}
function pQuota(){const rows=quotaRows(),thieu=rows.filter(r=>r.diff<0).length,thua=rows.filter(r=>r.diff>0).length;
  const sum=`${thieu} GV thiếu tiết, ${thua} GV thừa tiết, ${rows.length-thieu-thua} GV đủ định mức.`;
  const head=`<h2 class="foldh"><button class="foldb" data-act="foldQ" aria-expanded="${view.quotaOpen?'true':'false'}">Định mức tiết dạy<svg class="ic" aria-hidden="true" style="width:16px;height:16px;margin-left:6px;color:var(--muted)"><use href="#i-${view.quotaOpen?'down':'next'}"/></svg></button></h2>`;
  if(!view.quotaOpen)return `<section class="panel">${head}<p class="hint" style="margin:0">${sum} Bấm vào tiêu đề để mở bảng.</p></section>`;
  return `<section class="panel">${head}<p class="hint">Tiết quy đổi = tiết dạy theo phân công (cộng cả tiết SHL nếu là GVCN) + tiết giảm do kiêm nhiệm (GVCN tự cộng). So với định mức để biết ai thiếu, ai thừa tiết.</p>
<div class="form"><label>Định mức chung (tiết/tuần)<input type="number" min="1" max="30" data-f="quota" value="${S.quota||19}"></label><label>Giảm cho GVCN (tiết)<input type="number" min="0" max="10" data-f="gvcnRed" value="${S.gvcnRed==null?4:S.gvcnRed}"></label>
<button class="ghost" data-act="exQuota">Tải bảng định mức (Excel)</button></div>
<p class="hint" style="margin-top:10px">${sum}</p>
<div class="scroll"><table class="tbl"><thead><tr><th>Họ tên</th><th>Tiết dạy</th><th>Chủ nhiệm</th><th>Kiêm nhiệm</th><th>Giảm</th><th>Quy đổi</th><th>Định mức</th><th>Chênh lệch</th></tr></thead><tbody>
${rows.map(r=>`<tr><td>${esc(r.t.name)}</td><td class="n">${r.day}</td><td class="n">${esc(r.cn.join(', '))}</td><td class="n">${esc(r.t.duty||'')}</td><td class="n">${r.red}</td><td class="n">${r.total}</td><td class="n">${r.q}</td><td style="font-weight:600;color:${r.diff<0?'var(--bad)':r.diff>0?'var(--warn)':'var(--ok)'}">${r.diff<0?'Thiếu '+(-r.diff):r.diff>0?'Thừa '+r.diff:'Đủ'}</td></tr>`).join('')}
</tbody></table></div></section>`;}
function exportQuota(){const rows=quotaRows(),T0='<table border="1" cellspacing="0" cellpadding="4">';
  const body=T0+'<tr><th>STT</th><th>Họ tên</th><th>Tiết dạy</th><th>Chủ nhiệm</th><th>Kiêm nhiệm</th><th>Giảm</th><th>Quy đổi</th><th>Định mức</th><th>Thừa (+) / thiếu (-)</th></tr>'+rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.t.name)}</td><td>${r.day}</td><td>${esc(r.cn.join(', '))}</td><td>${esc(r.t.duty||'')}</td><td>${r.red}</td><td>${r.total}</td><td>${r.q}</td><td>${r.diff}</td></tr>`).join('')+'</table>';
  download('Dinh-muc-tiet-day.xls','\ufeff<html><head><meta charset="utf-8"><style>td,th{font-family:Arial;font-size:11pt}th{background:#e8ece6}</style></head><body>'+docHead('Bảng định mức tiết dạy')+body+docFoot()+'</body></html>','application/vnd.ms-excel');}

function pPairs(){const tl=S.teachers.map(t=>t.name);const ps=S.tPairs||[];
  return `<section class="panel"><h2>Ràng buộc giữa hai giáo viên (đi cùng buổi, không dạy cùng ngày…)</h2><p class="hint">Ví dụ hai vợ chồng cùng dạy trường: <b>đi cùng buổi</b> (đi chung xe, đến và về cùng lúc, nghỉ cùng ngày) hoặc ngược lại không dạy cùng ngày/buổi (một người ở nhà trông con). Nhóm 3 người trở lên: thêm A với B, rồi B với C. Với "Không dạy cùng": "Bắt buộc" thì không bao giờ trùng, "Ưu tiên" thì cố tránh. Với "Đi cùng buổi": luôn cố xếp cho cả nhóm có mặt cùng các buổi; "Bắt buộc" là mức ưu tiên rất cao (chỉ nhường cho đủ tiết, quy định bắt buộc và ngày nghỉ của GV). Nếu hai người chênh nhau nhiều tiết thì người ít tiết sẽ được dàn theo các buổi của người kia.</p>
<div class="form"><label>Giáo viên 1<select id="prA"><option value="">Chọn</option>${tl.map(n=>`<option>${esc(n)}</option>`).join('')}</select></label>
<label>Giáo viên 2<select id="prB"><option value="">Chọn</option>${tl.map(n=>`<option>${esc(n)}</option>`).join('')}</select></label>
<label>Kiểu ràng buộc<select id="prM"><option value="with">Đi cùng buổi (dạy cùng buổi)</option><option value="day">Không dạy cùng ngày</option><option value="ses">Không dạy cùng buổi</option></select></label>
<label>Mức độ<select id="prL"><option value="hard">Bắt buộc</option><option value="soft">Ưu tiên</option></select></label><button data-act="prAdd">Thêm ràng buộc</button></div>
${ps.length?`<div class="scroll" style="margin-top:10px"><table class="tbl"><tbody>${ps.map((p,i)=>`<tr><td><b>${esc(p.a)}</b> và <b>${esc(p.b)}</b>: ${p.mode==='with'?'<span class="tagw">đi cùng buổi</span>':'không dạy cùng '+(p.mode==='ses'?'buổi':'ngày')} <span class="hint">(${p.mode==='with'?(p.level==='soft'?'ưu tiên':'ưu tiên rất cao'):(p.level==='soft'?'ưu tiên':'bắt buộc')})</span></td><td style="width:1%"><button class="danger" data-act="prDel" data-i="${i}">Xóa</button></td></tr>`).join('')}</tbody></table></div>`:''}</section>`;}
/* Kiểm tra phân công so với chương trình (gom một chỗ, trước khi xếp) */
function checkAssign(){const out={missing:[],diff:[],dup:[],idle:[],unknown:[]};const sum={},tset={};
  S.assigns.forEach(a=>{const k=a.c+'|'+a.m;sum[k]=(sum[k]||0)+(+a.n||0);(tset[k]=tset[k]||new Set()).add(a.t);
    if(!S.classes.some(c=>c.name===a.c))out.unknown.push('Lớp '+a.c);if(!S.subjects.some(m=>m.name===a.m))out.unknown.push('Môn '+a.m);});
  S.classes.forEach(c=>S.subjects.forEach(m=>{if(m.fixed)return;const need=defN(m.name,c.name);const k=c.name+'|'+m.name,got=sum[k]||0;
    if(need==null||need===0){if(got&&need===0&&isSkip(c.name,m.name))out.diff.push(c.name+' – '+m.name+': lớp đánh dấu không học nhưng có '+got+' tiết');return;}
    if(!got)out.missing.push(c.name+' – '+m.name+' ('+need+' tiết)');else if(got!==need)out.diff.push(c.name+' – '+m.name+': phân công '+got+' tiết, chương trình '+need+' tiết');}));
  Object.entries(tset).forEach(([k,ts])=>{if(ts.size>1)out.dup.push(k.replace('|',' – ')+': '+[...ts].join(', '));});
  S.teachers.forEach(t=>{if(!S.assigns.some(a=>a.t===t.name))out.idle.push(t.name);});
  out.unknown=[...new Set(out.unknown)];return out;}
function pCheckAssign(){const r=checkAssign(),n=r.missing.length+r.diff.length+r.dup.length+r.unknown.length;
  const blk=(title,list,cls)=>list.length?`<details style="margin:6px 0"${list.length<=6?' open':''}><summary style="cursor:pointer" class="${cls}"><b>${title} (${list.length})</b></summary><div class="hint" style="margin:6px 0 0 18px;max-width:none">${list.slice(0,200).map(esc).join('<br>')}${list.length>200?'<br>…':''}</div></details>`:'';
  return `<section class="panel"><h2>Kiểm tra phân công so với chương trình</h2>${n||r.idle.length?'':'<div class="msg ok">Phân công khớp chương trình: lớp nào cũng đủ môn, đủ số tiết; không có lớp – môn nào bị phân cho 2 GV.</div>'}

  const g=confirm('GVCN có mặt ở tiết này?\n\nOK: GVCN không bị xếp dạy lớp khác vào tiết này.');
  const had=m.cg[view.cls*m.NS+sl]>=0;snapshot();own[k]={l:l.trim(),g};changed();render();
  toast(had?'Đã khóa. Tiết đang ở ô này chuyển sang danh sách chưa xếp, bấm "Xếp tiếp" để xếp lại.':'Đã khóa cứng ô này');});
}
function cellClick(sl,g){
  const em=g==='t'?'teacher':g==='c'?'class':view.mode;
  if(view.tBusy&&em==='teacher'){const m=model(),t=S.teachers[view.tch];if(!t)return;
    if(m.tg[view.tch*m.NS+sl]>=0){toast('Ô này GV đang có tiết dạy – chuyển tiết đi trước rồi mới đánh dấu bận');return;}
    if(m.teachers[view.tch].fixed.has(sl)){toast('Ô này là tiết GVCN (chào cờ/SHL)');return;}
    const k=TKB.slot2key(m,sl),b=new Set(t.busy||[]);b.has(k)?b.delete(k):b.add(k);t.busy=[...b];commit();changed();render();toast((b.has(k)?'Đã đánh dấu ':'Đã bỏ ')+'GV '+t.name+' bận ô này');return;}
  if(view.lockMode&&em==='class'){lockCell(sl);return;}
  const m=model(),NS=m.NS;
  const ent=em==='class'?m.cg[view.cls*NS+sl]:m.tg[view.tch*NS+sl];
  if(view.sel<0){if(ent>=0)view.sel=ent;render();return;}
  const u=m.units[view.sel];
  if(ent===u.id){view.sel=-1;render();return;}
  snapshot();
  if(ent<0){
    const cl=m.classes[u.c],tses=Math.floor(sl/m.P)&1;
    if(cl.ses==='SC'&&cl.pmOnly&&u.ses&&(u.ses==='S'?0:1)!==tses&&TKB.sesList(cl.ses).includes(tses)){hist.pop();crossMove(u,sl);return;}
    const old=m.pos[u.id];if(old>=0)TKB.remove(m,u);
    if(u.cands.includes(sl)&&TKB.feasible(m,u,sl)){TKB.place(m,u,sl);commit();view.sel=-1;toast('Đã chuyển '+m.subjects[u.m].name+' lớp '+m.classes[u.c].name);}
    else{const r=TKB.why(m,u,sl);if(old>=0)TKB.place(m,u,old);hist.pop();if(tryChain(m,u,sl))return;toast('Không chuyển được: '+(r.join('; ')||'ô không hợp lệ'));}
    render();return;
  }
  const v=m.units[ent];const pu=m.pos[u.id],pv=m.pos[v.id];
  if(u.len!==v.len){hist.pop();if(tryChain(m,u,m.pos[v.id]))return;toast('Chỉ đổi chỗ được hai tiết cùng độ dài (tiết đơn với tiết đơn, tiết đôi với tiết đôi).');return;}
  if(pu>=0)TKB.remove(m,u);TKB.remove(m,v);
  let ok=u.cands.includes(pv)&&TKB.feasible(m,u,pv),r=[];
  if(ok){TKB.place(m,u,pv);
    if(pu>=0){if(v.cands.includes(pu)&&TKB.feasible(m,v,pu))TKB.place(m,v,pu);else{r=TKB.why(m,v,pu).map(x=>m.subjects[v.m].name+': '+x);TKB.remove(m,u);ok=false;}}}
  else r=TKB.why(m,u,pv).map(x=>m.subjects[u.m].name+': '+x);
  if(ok){commit();view.sel=-1;toast(pu>=0?'Đã đổi chỗ hai tiết':'Đã đặt tiết, '+m.subjects[v.m].name+' chuyển sang danh sách chưa xếp');}
  else{if(pu>=0)TKB.place(m,u,pu);TKB.place(m,v,pv);hist.pop();if(tryChain(m,u,pv))return;toast('Không đổi được: '+(r.join('; ')||'không hợp lệ'));}
  render();
}


/* Đổi dây chuyền khi kéo thả: ô đích bận và không đổi thẳng được thì tìm chuỗi ngắn (2–3 tiết) để dời các tiết vướng đi chỗ khác.
   Để nguyên kết quả trên mô hình và trả về {desc, undo}; người dùng xác nhận mới ghi lại. */
function chainPlan(m,u,sl){if(!u.cands.includes(sl)||u.pinned)return null;
  const NS=m.NS,U=m.units,orig=new Map(),pu=m.pos[u.id];
  const st0=TKB.stats(m),bad0=st0.gaps.length+st0.pmGaps.length+(st0.siteBad||[]).length+st0.tGap.over.length;
  const mv=(w,to)=>{if(!orig.has(w.id))orig.set(w.id,m.pos[w.id]);if(m.pos[w.id]>=0)TKB.remove(m,w);if(to>=0)TKB.place(m,w,to);};
  const undo=()=>{for(const id of orig.keys())if(m.pos[id]>=0)TKB.remove(m,U[id]);for(const[id,p]of orig)if(p>=0)TKB.place(m,U[id],p);orig.clear();};
  const blockers=(w,st)=>{const s=new Set();for(let k=0;k<w.len;k++){const a=m.cg[w.c*NS+st+k],b=m.tg[w.t*NS+st+k];if(a>=0&&a!==w.id)s.add(a);if(b>=0&&b!==w.id)s.add(b);}return[...s].map(i=>U[i]);};
  const B=blockers(u,sl);if(!B.length||B.length>2||B.some(w=>w.pinned))return null;
  mv(u,-1);B.forEach(w=>mv(w,-1));
  if(!TKB.feasible(m,u,sl)){undo();return null;}mv(u,sl);
  /* đặt lại từng tiết bị bật ra: ưu tiên ô cũ của tiết vừa kéo, chọn chỗ cho điểm chất lượng tốt nhất; không có chỗ thì đẩy thêm 1 tiết nữa */
  const placeBest=w=>{let best=null,bs=Infinity;const cs=pu>=0&&w.cands.includes(pu)?[pu,...w.cands.filter(x=>x!==pu)]:w.cands;
    for(const st of cs)if(TKB.feasible(m,w,st)){TKB.place(m,w,st);const sc=TKB.score(m)-(st===pu?50:0);TKB.remove(m,w);if(sc<bs){bs=sc;best=st;}}
    if(best!=null){mv(w,best);return true;}return false;};
  const placeDeep=w=>{for(const st of w.cands){const Y=blockers(w,st);if(Y.length!==1||Y[0].pinned||Y[0].id===u.id||orig.has(Y[0].id))continue;const y=Y[0],py=m.pos[y.id];
      mv(y,-1);if(TKB.feasible(m,w,st)){mv(w,st);if(placeBest(y))return true;TKB.remove(m,w);m.pos[w.id]=-1;}if(m.pos[y.id]<0)TKB.place(m,y,py);}return false;};
  for(const w of B){if(!placeBest(w)&&!placeDeep(w)){undo();return null;}}
  const st1=TKB.stats(m),bad1=st1.gaps.length+st1.pmGaps.length+(st1.siteBad||[]).length+st1.tGap.over.length;
  if(st1.placed<st0.placed||bad1>bad0){undo();return null;}
  const nm=x=>m.subjects[x.m].name+' '+m.classes[x.c].name+' ('+m.teachers[x.t].name+')',sn=p=>p<0?'chưa xếp':slotName(TKB.slot2key(m,p));
  const lines=[...orig].filter(([id,p])=>m.pos[id]!==p).map(([id,p])=>'• '+nm(U[id])+': '+sn(p)+' → '+sn(m.pos[id]));
  return{desc:lines.join('\n'),n:lines.length,undo};}
function tryChain(m,u,sl){const pl=chainPlan(m,u,sl);if(!pl)return false;
  if(confirm('Không đổi thẳng được, nhưng có cách đổi dây chuyền '+pl.n+' tiết:\n\n'+pl.desc+'\n\nĐồng ý đổi?')){snapshot();commit();view.sel=-1;render();toast('Đã đổi dây chuyền '+pl.n+' tiết');return true;}
  pl.undo();return false;}
/* Kéo một tiết từ buổi chính sang buổi phụ (hoặc ngược lại): đổi phân công của lớp rồi đặt tiết vào ô đích */
function crossMove(u,sl){
  const m=model(),cl=m.classes[u.c],a=S.assigns[u.a],toSub=(Math.floor(sl/m.P)&1)===cl.sub,subL=cl.sub===1?'C':'S';
  const subj=m.subjects[u.m].name,word=toSub?'buổi phụ':'buổi chính';
  if(!confirm('Chuyển '+(u.len===2?'2 tiết ':'1 tiết ')+subj+' lớp '+cl.name+' sang '+word+' ('+SES[Math.floor(sl/m.P)&1].toLowerCase()+')?\n\nPhân công của lớp sẽ ghi lại số tiết học ở buổi phụ cho môn này.'))return;
  snapshot();
  const oldPos=m.pos[u.id],before={};m.units.forEach(x=>{if(x.a===u.a&&m.pos[x.id]>=0)before[x.key]=m.pos[x.id];});
  const n=+a.n||0;let nC=a.ses?(a.ses===subL?n:0):(+a.nC||0);
  nC=toSub?Math.min(n,nC+u.len):Math.max(0,nC-u.len);a.ses='';a.nC=nC||null;a.fixSes=true;
  changed();const m2=model();
  const units=m2.units.filter(x=>x.a===u.a);
  // tiết vừa bị bật ra do đổi buổi
  const loose=units.filter(x=>m2.pos[x.id]<0);
  let mover=loose.find(x=>x.len===u.len&&x.cands.includes(sl)&&TKB.feasible(m2,x,sl));
  if(!mover){toast('Đã đổi phân công nhưng ô đích chưa đặt được: '+(loose[0]?TKB.why(m2,loose[0],sl).join('; '):'không hợp lệ')+'. Tiết nằm ở danh sách chưa xếp.');commit();render();return;}
  TKB.place(m2,mover,sl);
  // giữ đúng ô người dùng đã kéo: nếu tiết bị bật ra không phải tiết đã kéo thì dời tiết đang ở ô cũ sang ô trống vừa bật
  const freed=before[mover.key];
  if(freed!=null&&freed!==oldPos){const w=units.find(x=>m2.pos[x.id]===oldPos&&x.len===u.len);
    if(w){TKB.remove(m2,w);if(w.cands.includes(freed)&&TKB.feasible(m2,w,freed))TKB.place(m2,w,freed);else TKB.place(m2,w,oldPos);}}
  commit();view.sel=-1;render();toast('Đã chuyển '+subj+' lớp '+cl.name+' sang '+word);
}

      for(let si=0;si<m.nSite;si++){if(o.site!=='all'&&m.sites[si]!==o.site)continue;for(let r=0;r<m.nR;r++){const cap=m.cap[si*m.nR+r];const any=m.units.some(u=>u.site===si&&u.room===r&&m.pos[u.id]>=0);if(!any)continue;

function tkbCanvas(m,kind,idx){const P=m.P,NS=m.NS,i=info(),D=S.days,sc=2,SN=['Sáng','Chiều'];
  const isT=kind==='t',ent=isT?m.teachers[idx]:m.classes[idx];if(!ent)return null;
  const cellOf=sl=>{if(isT){const id=m.tg[idx*NS+sl];if(id>=0){const u=m.units[id];return{a:m.subjects[u.m].name,b:m.classes[u.c].name+(m.nSite>1?' · '+m.sites[u.site]:''),mi:u.m};}const f=ent.fixed.get(sl);return f?{a:f,lock:1}:null;}
    const lk=m.lockLabel[idx].get(sl);if(lk){const c=m.classes[idx],ses=Math.floor(sl/P)&1;if(/toàn trường/i.test(lk)&&c.ses==='SC'&&c.main&&(c.main==='S'?0:1)!==ses)return null;return{a:lk,lock:1};}const id=m.cg[idx*NS+sl];if(id<0)return null;const u=m.units[id];return{a:m.subjects[u.m].name,b:ex.noT?'':m.teachers[u.t].name,mi:u.m};};
  const sess=[0,1].filter(s=>{if(!S.per[s])return false;for(let d=0;d<D;d++)for(let p=0;p<S.per[s];p++){const c=cellOf((d*2+s)*P+p);if(c&&!c.lock)return true;}return false;});
  if(!sess.length)return null;
  const W0=78,CW=Math.max(150,Math.min(190,Math.floor(1060/D))),RH=58,HH=40,top=118,SG=34;
  const nRows=sess.reduce((a,s)=>a+S.per[s],0),W=W0+CW*D+48,H=top+HH+nRows*RH+sess.length*SG+62;
  const cv=document.createElement('canvas');cv.width=W*sc;cv.height=H*sc;const g=cv.getContext('2d');g.scale(sc,sc);
  const F='"Segoe UI",Roboto,Arial,sans-serif',rr=(x,y,w,h,r)=>{g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();};
  const fit=(t,max)=>{if(g.measureText(t).width<=max)return t;while(t.length>1&&g.measureText(t+'…').width>max)t=t.slice(0,-1);return t+'…';};
  g.fillStyle='#f4f7f5';g.fillRect(0,0,W,H);
  const grd=g.createLinearGradient(0,0,W,0);grd.addColorStop(0,'#0b4a39');grd.addColorStop(1,'#16846a');g.fillStyle=grd;g.fillRect(0,0,W,92);
  g.fillStyle='#d9efe6';g.font='600 14px '+F;g.fillText(fit([i.school,i.year?'Năm học '+i.year:'',i.term].filter(Boolean).join(' · '),W-48),24,28);
  g.fillStyle='#fff';g.font='800 27px '+F;g.fillText(fit((isT?'TKB giáo viên: ':'Thời khóa biểu lớp ')+ent.name,W-48),24,64);
  let sub=[];if(isT){let n=0;m.units.forEach(u=>{if(u.t===idx&&m.pos[u.id]>=0)n+=u.len;});sub.push(n+' tiết/tuần');}
  else{const c=ent;if(m.nSite>1)sub.push(m.sites[c.site]);if(c.room)sub.push('Phòng '+c.room);if(c.gvcn>=0)sub.push('GVCN: '+m.teachers[c.gvcn].name);}
  if(i.from)sub.push('Áp dụng từ '+i.from);
  g.fillStyle='#3d4a55';g.font='600 14px '+F;g.fillText(fit(sub.join('   ·   '),W-48),24,top-12);
  const x0=24,y0=top;g.fillStyle='#0f5a45';rr(x0,y0,W0+CW*D,HH,10);g.fill();
  g.fillStyle='#fff';g.font='700 15px '+F;g.textAlign='center';g.fillText('Tiết',x0+W0/2,y0+26);for(let d=0;d<D;d++)g.fillText(DAYS[d],x0+W0+CW*d+CW/2,y0+26);
  let y=y0+HH;
  for(const s of sess){g.textAlign='left';g.fillStyle=s?'#4f46e5':'#c2410c';g.font='800 14px '+F;g.fillText('BUỔI '+SN[s].toUpperCase(),x0+4,y+22);y+=SG;
    for(let p=0;p<S.per[s];p++){g.fillStyle=p%2?'#eef3f0':'#ffffff';g.fillRect(x0,y,W0+CW*D,RH);
      g.fillStyle='#0f5a45';g.font='800 18px '+F;g.textAlign='center';g.fillText(String(p+1),x0+W0/2,y+RH/2+6);
      for(let d=0;d<D;d++){const c=cellOf((d*2+s)*P+p),cx=x0+W0+CW*d+4,cy=y+4,cw=CW-8,ch=RH-8;if(!c)continue;
        if(c.lock){g.fillStyle='#e6e9e7';rr(cx,cy,cw,ch,8);g.fill();g.fillStyle='#5b6571';g.font='italic 600 13px '+F;g.textAlign='center';g.fillText(fit(c.a,cw-10),cx+cw/2,cy+ch/2+5);continue;}
        const h=hueOf(m.subjects[c.mi].name);g.fillStyle=`hsl(${h} 62% 88%)`;rr(cx,cy,cw,ch,8);g.fill();g.strokeStyle=`hsl(${h} 40% 70%)`;g.lineWidth=1;g.stroke();
        g.textAlign='left';g.fillStyle='#1b2430';g.font='700 15px '+F;g.fillText(fit(c.a,cw-14),cx+8,cy+(c.b?21:ch/2+6));
        if(c.b){g.fillStyle='#3d4a55';g.font='13px '+F;g.fillText(fit(c.b,cw-14),cx+8,cy+40);}}

  return cv;}
const pngSlug=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').replace(/[^\w]+/g,'_').replace(/^_|_$/g,'');

function quickSave(kind){const a=listSaves();const item={name:(kind==='auto'?'Tự lưu sau khi xếp':'Lưu nhanh')+' – '+fmtTime(Date.now()),time:Date.now(),kind,data:slimS()};
  a.unshift(item);let q=0,au=0;const keep=a.filter(x=>x.kind==='quick'?++q<=10:x.kind==='auto'?++au<=5:true);
  if(writeSaves(keep)){if(kind!=='auto')toast('Đã lưu lúc '+fmtTime(item.time)+'. Xem và mở lại ở trang Lưu trữ.');if(tab==='data')render();}}
/* Bản lưu không chép lịch sử các lần xếp (runs, chiếm khoảng 2/3 dung lượng) để không làm đầy bộ nhớ trình duyệt */
function slimS(){const o=JSON.parse(JSON.stringify(S));delete o.runs;return o;}
function writeSaves(a){for(let k=0;k<12;k++){try{localStorage.setItem(SAVES,JSON.stringify(a));return true;}catch(e){
    /* đầy: bỏ dần bản tự lưu, rồi bản lưu nhanh cũ nhất; không đụng phương án đặt tên */
    let j=-1;for(let x=a.length-1;x>=0;x--)if(a[x].kind==='auto'){j=x;break;}if(j<0)for(let x=a.length-1;x>=0;x--)if(a[x].kind==='quick'){j=x;break;}
    if(j<1){toast('Bộ nhớ trình duyệt đã đầy. Hãy xóa bớt phương án cũ ở trang Lưu trữ hoặc tải dữ liệu ra file.');return false;}a.splice(j,1);}}return false;}
(function(){try{const a=listSaves();if(a.some(x=>x.data&&x.data.runs)){a.forEach(x=>{if(x.data)delete x.data.runs;});localStorage.setItem(SAVES,JSON.stringify(a));}}catch(e){}})();

/* ---------- Dạy thay ---------- */
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const dowOf=ds=>{if(!ds)return -1;const d=new Date(ds+'T00:00:00');const w=d.getDay();return w===0?6:w-1;};
const vnDate=ds=>{if(!ds)return'';const[y,m,d]=ds.split('-');return d+'/'+m+'/'+y;};
/* Đổi tiết trong tuần thay cho dạy thay: GV C (dạy cùng lớp) lên dạy giờ của GV nghỉ A; hôm khác A dạy trả giờ của C */
function swapCands(m,ti,sl,date,u,absDates){const P=m.P,NS=m.NS,ds=Math.floor(sl/P),d=ds>>1,out=[];
  const addDays=(dt,k)=>{const a=new Date(dt+'T00:00:00');a.setDate(a.getDate()+k);return a.getFullYear()+'-'+String(a.getMonth()+1).padStart(2,'0')+'-'+String(a.getDate()).padStart(2,'0');};
  const absent=dt=>new Set(S.subs.filter(x=>x.date===dt&&x.absent).map(x=>x.absent));
  const free=(t,st,len,dt)=>{for(let k=0;k<len;k++){const q=st+k;if(m.tg[t*NS+q]>=0||m.teachers[t].block.has(q)||m.teachers[t].fixed.has(q))return false;}
    if(S.subs.some(x=>x.date===dt&&x.sub===m.teachers[t].name&&x.slot===TKB.slot2key(m,st)))return false;return true;};
  const here=(t,dsx)=>{for(let p=0;p<m.per[dsx&1];p++)if(m.tg[t*NS+dsx*P+p]>=0)return true;return false;};
  for(const w of m.units){if(w.c!==u.c||w.t===ti||w.len!==u.len||m.pos[w.id]<0)continue;const Y=m.pos[w.id],dsY=Math.floor(Y/P),E=dsY>>1;if(E===d||E>=S.days)continue;
    const dateE=addDays(date,E>d?E-d:E-d+7);if(absDates.includes(dateE))continue;
    const C=w.t,cn=m.teachers[C].name;if(absent(date).has(cn)||absent(dateE).has(m.teachers[ti].name))continue;
    if(!free(C,sl,u.len,date)||!free(ti,Y,w.len,dateE))continue;
    const cHere=here(C,ds),aHere=here(ti,dsY),score=(cHere?30:0)+(aHere?30:0)+(m.units[w.id].site===u.site?10:0)-(E>d?E-d:E-d+7);
    out.push({val:'swap|'+cn+'|'+dateE+'|'+Y+'|'+w.id,score,label:'Đổi tiết với '+cn+' ('+m.subjects[w.m].name+'): '+DAYS[E]+' '+vnDate(dateE)+' '+SES[dsY&1].toLowerCase()+' tiết '+(Y%P+1)+' GV nghỉ dạy trả'+(cHere?'':' · '+cn.split(' ').pop()+' phải đến thêm buổi')+(aHere?'':' · GV nghỉ phải đến thêm buổi')});}
  return out.sort((a,b)=>b.score-a.score).slice(0,6);}
function subCands(m,ti,sl,date,subjName,site){
  const P=m.P,ds=Math.floor(sl/P),d=ds>>1,absent=new Set(S.subs.filter(x=>x.date===date&&x.absent).map(x=>x.absent));
  const taken=new Set(S.subs.filter(x=>x.date===date&&x.slot===TKB.slot2key(m,sl)&&x.sub).map(x=>x.sub));
  const teach=new Map();m.units.forEach(u=>{(teach.get(u.t)||teach.set(u.t,new Set()).get(u.t)).add(m.subjects[u.m].name);});
  const out=[];
  m.teachers.forEach((t,j)=>{if(j===ti||absent.has(t.name)||taken.has(t.name))return;if(m.tg[j*m.NS+sl]>=0||t.block.has(sl))return;
    let load=0,sitesHere=new Set();for(const s of [0,1])for(let p=0;p<m.per[s];p++){const id=m.tg[j*m.NS+(d*2+s)*P+p];if(id>=0&&m.pos[id]===(d*2+s)*P+p){load+=m.units[id].len;if(s===(ds&1))sitesHere.add(m.units[id].site);}}
    const same=(teach.get(j)||new Set()).has(subjName),other=[...sitesHere].some(x=>x!==site);
    const extra=S.subs.filter(x=>x.date===date&&x.sub===t.name).length;
    const score=(same?100:0)+(sitesHere.has(site)?20:0)-(other?40:0)-(load+extra)*3;
    out.push({name:t.name,score,note:[same?'cùng môn':'',sitesHere.has(site)?'đang ở điểm này':other?'đang dạy điểm khác':'',(load+extra)+' tiết trong ngày'].filter(Boolean).join(', ')});});
  return out.sort((a,b)=>b.score-a.score);
}

function verDiff(v){const m=model(),byT=new Map(),seen=new Set();
  const add=(t,txt)=>{(byT.get(t)||byT.set(t,[]).get(t)).push(txt);};
  m.units.forEach(u=>{seen.add(u.key);const o=v.pos[u.key],n=m.pos[u.id]>=0?TKB.slot2key(m,m.pos[u.id]):null;if(o===n)return;
    const lab=m.classes[u.c].name+' '+m.subjects[u.m].name+(u.len===2?' (2 tiết)':'');
    add(m.teachers[u.t].name,lab+': '+(o?slotName(o):'(mới)')+' → '+(n?slotName(n):'(chưa xếp)'));});
  Object.keys(v.pos).forEach(k=>{if(seen.has(k))return;const[c,mm,t]=k.split('#')[0].split('|');add(t,c+' '+mm+': '+slotName(v.pos[k])+' → (bỏ)');});
  return byT;}

function progFn(p){const b=document.getElementById('pbar'),t=document.getElementById('ptext');const pre=p.runs>1?'Phương án '+p.run+'/'+p.runs+' – ':'';
  if(p.phase==='compact'){if(b)b.style.width=Math.round(p.frac*100)+'%';if(t)t.textContent=pre+'Đã xếp đủ, đang dồn lịch GV cho gọn… '+Math.round(p.frac*100)+'% (điểm chất lượng '+Math.round(p.score)+', càng nhỏ càng tốt)';return;}

/* Bộ xếp chạy trong luồng riêng (Web Worker tạo từ chính khối <script id="engine">): giao diện không bị khựng, có nút Dừng.
   Trình duyệt không cho tạo Worker thì tự chạy như cũ trên luồng giao diện. */
let curWorker=null,wkStopping=false;
function wkSource(){return document.getElementById('engine').textContent+`
;(function(){const pn=performance.now.bind(performance),dn=Date.now;let stop=false,off=0;
  /* khi bấm Dừng: cho đồng hồ chạy vượt, mọi pha đang giới hạn thời gian kết thúc ngay và giữ kết quả tốt nhất */
  performance.now=()=>stop?(off+=1e7,pn()+off):pn();Date.now=()=>stop?(off+=1e7,dn()+off):dn();
  self.onmessage=e=>{const d=e.data;if(d.type==='stop'){stop=true;TKB.setStop(true);return;}
    if(d.type!=='run')return;const M=TKB.build(d.S);
    const done=()=>{try{const st=TKB.stats(M);postMessage({type:'done',res:TKB.exportPos(M),stopped:stop,placed:st.placed});}catch(err){postMessage({type:'err',msg:String(err&&err.message||err)});}};
    try{if(d.mode==='compact')TKB.compactPhase(M,{ms:d.ms||12000},p=>postMessage({type:'prog',p}),done);
      else(d.multi?TKB.solveMulti:TKB.solve)(M,d.opts,p=>postMessage({type:'prog',p}),done);}
    catch(err){postMessage({type:'err',msg:String(err&&err.message||err)});}};})();`;}
function startWorker(msg,onDone,fallback){let w,url,got=false;
  try{if(typeof Worker==='undefined')return false;url=URL.createObjectURL(new Blob([wkSource()],{type:'text/javascript'}));w=new Worker(url);}catch(e){return false;}
  const end=()=>{try{w.terminate();}catch(e){}URL.revokeObjectURL(url);if(curWorker===w)curWorker=null;wkStopping=false;};
  w.onmessage=e=>{got=true;const d=e.data;if(d.type==='prog')progFn(d.p);else if(d.type==='done'){end();onDone(d);}else if(d.type==='err'){end();solving=false;render();toast('Lỗi khi xếp: '+d.msg);}};
  w.onerror=ev=>{ev.preventDefault&&ev.preventDefault();end();if(!got&&fallback)fallback();else{solving=false;render();toast('Lỗi khi xếp: '+(ev.message||''));}};
  curWorker=w;w.postMessage(Object.assign({type:'run',S:JSON.parse(JSON.stringify(S))},msg));return true;}
function applyWorkerResult(m0,d){solving=false;if(M!==m0){render();toast('Dữ liệu đã bị sửa trong lúc xếp nên kết quả lần này không được lưu. Hãy bấm xếp lại.');return null;}
  S.result=d.res;M=null;const m=model();save();return m;}
function runCompact(){const m=model();if(!TKB.stats(m).placed)return;solving=true;snapshot();
  const old=()=>TKB.compactPhase(m,{ms:12000},progFn,st=>{solving=false;if(M!==m){render();return;}commit();render();toast('Đã dồn lịch thêm');});
  if(!startWorker({mode:'compact',ms:12000},d=>{if(applyWorkerResult(m,d)){render();toast(d.stopped?'Đã dừng, giữ kết quả tốt nhất':'Đã dồn lịch thêm');}},old))old();
  render();}
function runSolve(fresh){
  const m=model(),opts={fresh,runs:S.tries||3,ms:(+S.optSec||0)*1000||undefined},multi=fresh&&(S.tries||3)>1;solving=true;
  const record=(m,st,stopped)=>{setTimeout(()=>quickSave('auto'),50);
    S.runs=S.runs||[];S.runs.unshift({time:Date.now(),placed:st.placed,total:st.total,ses:Array.from(m.tSessN).reduce((a,b)=>a+b,0),off:st.offV.length,mv:st.movesIn,gaps:st.gaps.length+st.pmGaps.length,tgap:st.tGap.total,pos:JSON.parse(JSON.stringify(S.result.pos))});S.runs=S.runs.slice(0,6);save();render();
    toast((stopped?'Đã dừng theo yêu cầu. ':'')+(st.unplaced.length?'Xếp xong, còn '+st.unplaced.length+' lần chưa xếp được':'Xếp xong, đủ tất cả các tiết'));};
  const old=()=>(multi?TKB.solveMulti:TKB.solve)(m,opts,progFn,st=>{solving=false;if(M!==m){render();toast('Dữ liệu đã bị sửa trong lúc xếp nên kết quả lần này không được lưu. Hãy bấm xếp lại.');return;}commit();record(m,st,false);});
  if(!startWorker({mode:'solve',multi,opts},d=>{const m2=applyWorkerResult(m,d);if(m2)record(m2,TKB.stats(m2),d.stopped);},old))old();

    case 'subjN':S.subjects[i].n=v===''?null:clamp(v,0,12);break;
    case 'subjNG':S.subjects[i].nG=v.trim();break;
    case 'paT':view.paT=v.trim();break;
    case 'ptT':view.ptT=+v;render();return;
    case 'ptSite':view.ptSite=v;render();return;
    case 'ptSubj':{const t=S.teachers[view.ptT],k=el.dataset.k;const s=new Set(t.subjects||[]);
      if(v)s.add(k);else{const own=S.assigns.filter(a=>a.t===t.name&&a.m===k).length;if(own&&!confirm('Bỏ môn '+k+' sẽ xóa '+own+' lớp đang phân công cho '+t.name+'. Tiếp tục?')){render();return;}S.assigns=S.assigns.filter(a=>!(a.t===t.name&&a.m===k));s.delete(k);}
      t.subjects=[...s];changed();render();return;}
    case 'ptCls':{const t=S.teachers[view.ptT],c=el.dataset.c,k=el.dataset.k;
      if(v){const others=S.assigns.filter(a=>a.c===c&&a.m===k&&a.t!==t.name).map(a=>a.t);
        needN(k,[c],()=>{assignOne(t.name,c,k,true);changed();render();toast(others.length?'Đã chuyển '+k+' lớp '+c+' từ '+others.join(', ')+' sang '+t.name:'Đã giao '+k+' lớp '+c);});render();return;}
      assignOne(t.name,c,k,false);changed();render();return;}
    case 'ptGv':{const t=S.teachers[view.ptT];S.classes.forEach(c=>{if(c.gvcn===t.name)c.gvcn='';});if(v){const c=S.classes.find(x=>x.name===v);if(c)c.gvcn=t.name;}changed();render();toast(v?t.name+' chủ nhiệm lớp '+v:'Đã bỏ chủ nhiệm');return;}
    case 'paG':view.paG=v;break;
    case 'paSite':view.paSite=v;break;
    case 'clsRoom':S.classes[i].room=v.trim();break;
    case 'tGapMax':S.tGapMax=clamp(v,0,4);break;
    case 'tGapMode':S.tGapMode=v;break;
    case 'heavyMax':S.heavyMax=v?clamp(v,0,8):null;break;
    case 'heavyRunM':S.heavyRunM=v===''?2:clamp(v,0,5);break;
    case 'link51':S.link51=v;delete S.noLink51;break;
    case 'extGap':S.extGap=clamp(v,0,3);break;
    case 'aS':S.assigns[i].ses=v;break;
    case 'brk0':S.brk=S.brk||[0,0];S.brk[0]=clamp(v,0,5);break;
    case 'brk1':S.brk=S.brk||[0,0];S.brk[1]=clamp(v,0,5);break;
    case 'brkMode':S.brkMode=v;break;
    case 'brkSubj':S.brkSubj=v.trim();break;
    case 'vSite':view.site=+v;break;
    case 'subDate':view.subDate=v;view.subMonth=v.slice(0,7);if(view.subTo&&view.subTo<v)view.subTo='';break;
    case 'subTo':view.subTo=v;break;
    case 'subT':view.subT=+v;break;
    case 'subMonth':view.subMonth=v;break;
    case 'aC':S.assigns[i].c=v.trim();ensureEntities();break;
    case 'aM':S.assigns[i].m=v.trim();ensureEntities();break;
    case 'aT':S.assigns[i].t=v.trim();ensureEntities();break;
    case 'aN':S.assigns[i].n=clamp(v,0,12);break;
    case 'aD':S.assigns[i].dbl=clamp(v,0,6);delete S.assigns[i].noDbl;break;
    case 'filterA':view.filterA=v;break;
    case 'vCls':view.cls=+v;view.sel=-1;break;
    case 'mvCls':view.mvCls=+v;render();return;
    case 'vTch':view.tch=+v;view.sel=-1;break;
    case 'vSes':view.ses=+v;break;
  }
  if(!viewOnly[f])changed();render();
});
document.getElementById('fileIn').addEventListener('change',e=>{
  const file=e.target.files[0];if(!file)return;const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!Array.isArray(o.assigns))throw 0;pendingImport={name:file.name,data:o};tab='data';render();window.scrollTo(0,0);toast('Đã đọc '+file.name+'. Chọn phần muốn lấy rồi bấm "Nhập".');}catch(err){toast('File không đúng định dạng dữ liệu TKB');}e.target.value='';};
  r.readAsText(file);
});
render();
</script>
<script id="desktop-shim">
/* Chỉ chạy khi phần mềm được đóng gói thành file .exe (Tauri). Mở bằng Chrome/Edge thì đoạn này không làm gì. */
(function(){const T=window.__TAURI__;if(!T||!T.core)return;
  async function saveHref(href,name){try{const r=await fetch(href),b=new Uint8Array(await r.arrayBuffer());
      const ok=await T.core.invoke('save_file',{name:name||'tep',data:Array.from(b)});if(ok&&typeof toast==='function')toast('Đã lưu '+name);}
    catch(err){alert('Không lưu được file: '+err);}}
  const oc=HTMLAnchorElement.prototype.click;
  HTMLAnchorElement.prototype.click=function(){if(this.hasAttribute('download')&&/^(blob:|data:)/.test(this.href)){saveHref(this.href,this.getAttribute('download'));return;}return oc.call(this);};
  document.addEventListener('click',e=>{const a=e.target&&e.target.closest&&e.target.closest('a[download]');if(a&&/^(blob:|data:)/.test(a.href)){e.preventDefault();saveHref(a.href,a.getAttribute('download'));}},true);
  /* cửa sổ mới (báo cáo BGH...): in qua khung ẩn ngay trong ứng dụng */
  const ow=window.open;window.open=function(u){if(!u||u==='about:blank'){const f=document.createElement('iframe');f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';document.body.appendChild(f);setTimeout(()=>f.remove(),10*60*1000);return f.contentWindow;}return ow.apply(window,arguments);};
  document.documentElement.classList.add('desktop-app');
})();
</script>
